[tool:pytest]
# The suite is tests/, not the verify scripts.
#
# Collecting `check_*` out of `*_verify.py` looked convenient and was actively
# harmful. Every pillar names its scripts `sheetNN_verify.py`, so importing them
# by module name collided: pytest reported `231 tests collected, 38 errors`, and
# the 231 were algebra alone. 1,254 of the 1,485 check functions were invisible,
# which is a large part of why nothing ever caught the 16 empty ones. It also
# made each check simultaneously the code and its own test, so mutation testing
# could never produce a signal.
#
# tests/test_answer_binding.py now drives all 1,155 published questions through
# one parametrised test, importing each script by path.
testpaths = tests
pythonpath = .

# Import by file location rather than by prepending to sys.path, so files that
# share a basename across pillars stop colliding and `number-theory` (a hyphen,
# never a valid package name) can be imported at all.
addopts = --import-mode=importlib

# variant_retriever/ sits on disk untracked while the retriever lives on its own
# branch; logic/vault/ holds superseded copies of earlier pillar revisions that
# must not be collected as if they were published.
norecursedirs = variant_retriever .venv .agents mutants .hypothesis .git logic/vault

[mutmut]
# Mutate the library code, not the assertions.
#
# This was `source_paths=algebra/verify/`, which asked mutmut to mutate the
# check functions and then find the tests covering them. There are none: the
# check *is* the test. Every one of the 9,016 generated mutants came back with
# exit code 33 — "no tests" — so the suite has never killed a single mutant,
# while README and CONTRIBUTING both promised contributors it would reject their
# PR for a facade test.
#
# tools/ is genuine library code: latex_bridge parses the answer keys and
# answer_binding compares them, and tests/ exercises both across all 1,155
# questions. A mutant there gets killed or survives for a real reason.
source_paths=tools/
runner=pytest tests/ -x -q
also_copy=
    sheets.json
    verify/
    algebra/
    combinatorics/
    number-theory/
    logic/
    sequences/
