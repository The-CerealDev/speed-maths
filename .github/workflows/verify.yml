name: Verify

# The computational verification pipeline (see CONTRIBUTING.md ->
# "Verification pipeline").
#
# This does NOT run tools/similarity_check.py — that tool reads the local
# research/ corpus, which is gitignored and never exists on a CI runner, on
# purpose (copyright). Plagiarism checking stays a local, pre-PR step.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Per-pillar gate: the scripts a reviewer is told to run themselves.
  run-existing-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # calculus/ and graphs/ have no .tex sources yet — only stray LaTeX
        # build artifacts — and are marked "draft" in sheets.json. Add them here
        # when they have sheets to check.
        pillar: [algebra, combinatorics, number-theory, logic, sequences]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Without this the whole job is a no-op that reports success. 24 of the 35
      # verify scripts import sympy or hypothesis, and setup-python provides
      # neither, so run_all.py exits 1 on ImportError. The suite last passed here
      # while every script was still stdlib-only.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ${{ matrix.pillar }}/verify
        run: python3 ${{ matrix.pillar }}/verify/run_all.py

  # Runtime binding: every published answer compared against the check that
  # claims to verify it. 1,155 parametrised cases.
  answer-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Compare every published answer against its check
        run: python3 -m pytest -q

  # Static gates. These catch what a passing suite cannot: a check that passes
  # while verifying nothing, or while ignoring its own answer key.
  static-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Binding gate (ratcheted against verify/BINDING_BASELINE.json)
        run: python3 tools/check_binding.py

      # --strict because the count is now zero. Every published check asserts
      # something that depends on a value it computed, so any regression here is
      # a new facade and should fail the build rather than print a warning.
      - name: Facade detector
        run: python3 tools/analyze_facades.py --strict

      - name: Verify-script structure
        run: python3 tools/validate_verify_scripts.py

  new-sheets-must-ship-a-verify-script:
    # CONTRIBUTING.md requires every sheet to ship a verify script. All 35
    # published sheets have one, so this only inspects sheets touched in *this*
    # PR, which keeps the failure message pointed at the contributor's change.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every changed sheet has a matching verify script
        run: |
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- '*/sheets/sheet*.tex')
          if [ -z "$changed" ]; then
            echo "No sheet files changed in this PR."
            exit 0
          fi
          missing=0
          for f in $changed; do
            pillar=$(echo "$f" | cut -d/ -f1)
            num=$(basename "$f" .tex | sed 's/sheet//')
            expected="$pillar/verify/sheet${num}_verify.py"
            if [ ! -f "$expected" ]; then
              echo "MISSING: $f has no $expected"
              missing=1
            else
              echo "OK: $f -> $expected"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "One or more new/changed sheets have no verify script. See CONTRIBUTING.md -> Verification pipeline."
            exit 1
          fi
