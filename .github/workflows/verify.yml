name: Verify

# The computational verification pipeline (see CONTRIBUTING.md ->
# "Verification pipeline").
#
# Implements Differential / Incremental CI:
# 1. Skips entirely if only docs/assets/markdown changed (anti-waste).
# 2. On PRs, tests only the touched pillar(s) in ~10-12 seconds.
# 3. Circuit-breaker: If core tools/shared code change, escalates to full 100% regression.
# 4. On push to main: Runs full monolithic suite across all pillars (Tier 2 parity).

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'assets/**'
      - 'templates/**'
      - '*.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'archive.css'
      - 'style.css'
      - 'tokens.css'
      - 'favicon.*'
      - 'CNAME'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'assets/**'
      - 'templates/**'
      - '*.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'archive.css'
      - 'style.css'
      - 'tokens.css'
      - 'favicon.*'
      - 'CNAME'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  # Per-pillar gate: Differential execution per pillar
  run-existing-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pillar: [algebra, combinatorics, number-theory, logic, sequences]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if pillar should run
        id: check
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Push to main: running full suite for ${{ matrix.pillar }}."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          diff_files=$(git diff --name-only "$base" "$head")

          # Circuit breaker: If core tools, shared preamble, tests or CI changed, run all pillars
          if echo "$diff_files" | grep -qE '^(tools/|tests/|shared/|verify/|requirements|\.github/|setup\.cfg)'; then
            echo "Core infrastructure modified — running full suite for ${{ matrix.pillar }}."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Otherwise, only run if this pillar was touched
          if echo "$diff_files" | grep -q "^${{ matrix.pillar }}/"; then
            echo "${{ matrix.pillar }} modified in PR — running verification."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "${{ matrix.pillar }} untouched in PR — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.run == 'true'
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: pip install -r requirements-dev.txt

      - name: Run ${{ matrix.pillar }}/verify
        if: steps.check.outputs.run == 'true'
        run: python3 ${{ matrix.pillar }}/verify/run_all.py

  # Runtime binding: Targeted or full pytest execution
  answer-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine test filter
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Push to main: running complete 1,155-question binding suite."
            echo "filter=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          diff_files=$(git diff --name-only "$base" "$head")

          # Circuit breaker: If core tools, shared preamble, tests or config changed, run all tests
          if echo "$diff_files" | grep -qE '^(tools/|tests/|shared/|verify/|requirements|\.github/|setup\.cfg)'; then
            echo "Core infrastructure modified — running all 1,155+ answer binding tests."
            echo "filter=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find which pillars were modified
          pillars=$(echo "$diff_files" | grep -oE '^[a-z-]+/' | sort -u | tr -d '/')
          if [ -z "$pillars" ]; then
            echo "No specific pillar directory touched — running full test suite as fallback."
            echo "filter=" >> "$GITHUB_OUTPUT"
          else
            pattern=$(echo "$pillars" | paste -sd '|' -)
            echo "Targeted pillars: $pattern"
            echo "filter=-k \"$pattern\"" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compare every published answer against its check
        run: python3 -m pytest -q ${{ steps.filter.outputs.filter }}

  # Static gates. These catch what a passing suite cannot: a check that passes
  # while verifying nothing, or while ignoring its own answer key.
  static-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Binding gate (ratcheted against verify/BINDING_BASELINE.json)
        run: python3 tools/check_binding.py

      # --strict because the count is now zero. Every published check asserts
      # something that depends on a value it computed, so any regression here is
      # a new facade and should fail the build rather than print a warning.
      - name: Facade detector
        run: python3 tools/analyze_facades.py --strict

      - name: Verify-script structure
        run: python3 tools/validate_verify_scripts.py

  new-sheets-must-ship-a-verify-script:
    # CONTRIBUTING.md requires every sheet to ship a verify script. All 35
    # published sheets have one, so this only inspects sheets touched in *this*
    # PR, which keeps the failure message pointed at the contributor's change.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every changed sheet has a matching verify script
        run: |
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- '*/sheets/sheet*.tex')
          if [ -z "$changed" ]; then
            echo "No sheet files changed in this PR."
            exit 0
          fi
          missing=0
          for f in $changed; do
            pillar=$(echo "$f" | cut -d/ -f1)
            num=$(basename "$f" .tex | sed 's/sheet//')
            expected="$pillar/verify/sheet${num}_verify.py"
            if [ ! -f "$expected" ]; then
              echo "MISSING: $f has no $expected"
              missing=1
            else
              echo "OK: $f -> $expected"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "One or more new/changed sheets have no verify script. See CONTRIBUTING.md -> Verification pipeline."
            exit 1
          fi
