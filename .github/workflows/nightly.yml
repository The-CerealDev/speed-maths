name: Nightly Regression & Mutation Testing

# Scheduled deep-verification suite.
#
# Runs every night at 23:00 UTC (12:00 Midnight UK time) and on-demand via workflow_dispatch
# to guarantee absolute repository-wide mathematical purity.

on:
  schedule:
    - cron: '0 23 * * *'  # 23:00 UTC = 12:00 Midnight UK time daily
  workflow_dispatch:     # Manual trigger via GitHub UI

permissions:
  contents: read

jobs:
  # Monolithic 100% full regression across the entire corpus
  full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify all pillars
        run: |
          for p in algebra combinatorics number-theory logic sequences; do
            echo "── Running $p/verify/run_all.py ──"
            python3 $p/verify/run_all.py
          done

      - name: Full Answer Binding (all 1,155+ questions)
        run: python3 -m pytest -q

      - name: Static Gates (AST Facade & Baseline Ratchet)
        run: |
          python3 tools/check_binding.py
          python3 tools/analyze_facades.py --strict
          python3 tools/validate_verify_scripts.py

  # Parallel mutation testing on tools/ (latex_bridge & answer_binding)
  mutation-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - tools/answer_binding.py
          - tools/latex_bridge.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies & mutmut
        run: |
          pip install -r requirements-dev.txt
          pip install mutmut

      - name: Cache mutants
        uses: actions/cache@v4
        with:
          path: mutants
          key: mutmut-${{ matrix.target }}-${{ hashFiles(matrix.target) }}
          restore-keys: |
            mutmut-${{ matrix.target }}-

      - name: Configure mutmut for ${{ matrix.target }}
        run: |
          python3 -c "
          lines = open('setup.cfg').read().splitlines()
          out = []
          skip = False
          for line in lines:
              if line.strip() == 'only_mutate=':
                  out.append('only_mutate=')
                  out.append('    ${{ matrix.target }}')
                  skip = True
              elif skip and line.startswith('runner='):
                  skip = False
                  out.append(line)
              elif not skip:
                  out.append(line)
          open('setup.cfg', 'w').write('\n'.join(out) + '\n')
          "
          echo "── Configured setup.cfg ──"
          git diff setup.cfg

      - name: Run mutmut on ${{ matrix.target }}
        run: |
          mkdir -p mutants
          python3 -m mutmut run || true

      - name: Mutation Test Results
        run: |
          python3 -m mutmut results || true
          python3 -m mutmut show all 2>/dev/null | head -n 100 || true
